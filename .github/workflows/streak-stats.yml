name: Update Streak Stats

on:
  schedule:
    - cron: "0 1 * * *"   # daily at 01:00 UTC (offset from stats.yml to avoid conflicts)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&background=0D0D0D&stroke=FF00FF&ring=00FFFF&fire=FF00FF&currStreakLabel=00FFFF&sideLabels=FF00FF&dates=AAAAAA&currStreakNum=FFFFFF&sideNums=FFFFFF"
          path: profile/streak.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git pull --rebase origin main
          git push
